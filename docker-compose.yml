# docker-compose.yml
name: event-ticketing-platform

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  ticketing-network:
    driver: bridge

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  catalog_pgdata:
  inventory_pgdata:
  booking_pgdata:
  auth_pgdata:
  redis_data:
  kafka_data:

# ─────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────
services:

  # ── Infrastructure ──────────────────────────

  catalog-postgres:
    image: postgres:17-alpine
    container_name: catalog-postgres
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog_db}
      POSTGRES_USER: ${CATALOG_DB_USERNAME:-catalog_user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass}
    ports:
      - "${CATALOG_DB_PORT:-5433}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USERNAME:-catalog_user} -d ${CATALOG_DB_NAME:-catalog_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  inventory-postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
      POSTGRES_USER: ${INVENTORY_DB_USERNAME:-inventory_user}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_pass}
    ports:
      - "${INVENTORY_DB_PORT:-5434}:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USERNAME:-inventory_user} -d ${INVENTORY_DB_NAME:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  booking-postgres:
    image: postgres:17-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME:-booking_db}
      POSTGRES_USER: ${BOOKING_DB_USERNAME:-booking_user}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pass}
    ports:
      - "${BOOKING_DB_PORT:-5435}:5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USERNAME:-booking_user} -d ${BOOKING_DB_NAME:-booking_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  auth-postgres:
    image: postgres:17-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USERNAME:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
    ports:
      - "${AUTH_DB_PORT:-5436}:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USERNAME:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: ticketing-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticketing-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketing-kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ticketing-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Application Services ─────────────────────

  catalog-service:
    image: ticketing/catalog-service:latest
    container_name: catalog-service
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    ports:
      - "8081:8081"
    networks:
      - ticketing-network
    volumes:
      - ./logs/catalog-service:/app/logs
    environment:
      CATALOG_DB_URL: jdbc:postgresql://catalog-postgres:5432/catalog_db
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      catalog-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    restart: unless-stopped

  inventory-service:
    image: ticketing/inventory-service:latest
    container_name: inventory-service
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8082:8082"
    networks:
      - ticketing-network
    volumes:
      - ./logs/inventory-service:/app/logs
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://inventory-postgres:5432/inventory_db
      INVENTORY_DB_USERNAME: ${INVENTORY_DB_USERNAME:-inventory_user}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      inventory-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    restart: unless-stopped

  auth-service:
    image: ticketing/auth-service:latest
    container_name: auth-service
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8085:8085"
    networks:
      - ticketing-network
    volumes:
      - ./logs/auth-service:/app/logs
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.25'
    restart: unless-stopped

  booking-service:
    image: ticketing/booking-service:latest
    container_name: booking-service
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    ports:
      - "8083:8083"
    networks:
      - ticketing-network
    volumes:
      - ./logs/booking-service:/app/logs
    environment:
      BOOKING_DB_URL: jdbc:postgresql://booking-postgres:5432/booking_db
      BOOKING_DB_USERNAME: ${BOOKING_DB_USERNAME:-booking_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8086
    depends_on:
      booking-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    restart: unless-stopped

  payment-service:
    image: ticketing/payment-service:latest
    container_name: payment-service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8086:8086"
    networks:
      - ticketing-network
    volumes:
      - ./logs/payment-service:/app/logs
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.25'
    restart: unless-stopped

  notification-service:
    image: ticketing/notification-service:latest
    container_name: notification-service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8084:8084"
    networks:
      - ticketing-network
    volumes:
      - ./logs/notification-service:/app/logs
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: 587
      SMTP_USERNAME: resend
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    restart: unless-stopped
# Headless Service (clusterIP: None) — required so the StatefulSet pod gets a stable
# per-pod DNS name (kafka-0.kafka.ticketing.svc.cluster.local). Kafka's advertised
# listener MUST resolve to the broker's real pod address, not a load-balanced ClusterIP:
# a client (including the broker itself, via readiness probe) that gets redirected to a
# ClusterIP VIP for a Service it is itself a backend of hits a hairpin-NAT self-connection
# that this cluster's CNI doesn't support, causing "could not be established" / timeouts.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  # Without this, DNS for kafka-0 is only published once kafka-0 is Ready — but its own
  # readinessProbe needs to resolve that same name (its advertised listener), which would
  # deadlock. This is the documented StatefulSet pattern for that bootstrap problem.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.ticketing.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              # kafka-topics.sh spins up its own JVM per call — expensive under a tight CPU
              # limit, so give it a generous timeout and don't poll too often.
              command: ["/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            # Cheap TCP check only — an exec probe that launches a JVM here would compete
            # with the broker itself for CPU and cause false-positive restarts.
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 400m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi

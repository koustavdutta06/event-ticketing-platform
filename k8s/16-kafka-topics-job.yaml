apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.8.0
          command:
            - /bin/bash
            - -c
            - |
              set -e
              BOOTSTRAP=kafka-0.kafka.ticketing.svc.cluster.local:9092
              echo "Waiting for Kafka to be ready..."
              until /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server $BOOTSTRAP > /dev/null 2>&1; do
                echo "Kafka not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "Kafka ready. Creating topics..."
              for TOPIC_SPEC in seat-events:3 payment-events:3 booking-events:3 notification-events:3; do
                TOPIC="${TOPIC_SPEC%%:*}"
                PARTITIONS="${TOPIC_SPEC##*:}"
                /opt/kafka/bin/kafka-topics.sh \
                  --create --if-not-exists \
                  --topic "$TOPIC" \
                  --bootstrap-server $BOOTSTRAP \
                  --partitions $PARTITIONS \
                  --replication-factor 1 \
                  --config retention.ms=604800000 \
                  --config retention.bytes=1073741824
                echo "Topic created (or already exists): $TOPIC ($PARTITIONS partitions)"
              done
              echo "All topics ready."

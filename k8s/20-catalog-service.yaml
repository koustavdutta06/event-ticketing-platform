apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h catalog-postgres -p 5432 -U catalog_user; do echo waiting for catalog-postgres; sleep 3; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka-0.kafka.ticketing.svc.cluster.local 9092; do echo waiting for kafka; sleep 3; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 3; done"]
      containers:
        - name: catalog-service
          image: ticketing/catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: CATALOG_DB_URL
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: CATALOG_DB_URL }
            - name: CATALOG_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: catalog-db-secret, key: POSTGRES_USER }
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: catalog-db-secret, key: POSTGRES_PASSWORD }
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: KAFKA_BOOTSTRAP_SERVERS }
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: REDIS_HOST }
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: REDIS_PORT }
            - name: ZIPKIN_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: observability-config, key: ZIPKIN_ENDPOINT }
            - name: LOGSTASH_HOST
              valueFrom:
                configMapKeyRef: { name: observability-config, key: LOGSTASH_HOST }
            - name: LOGSTASH_PORT
              valueFrom:
                configMapKeyRef: { name: observability-config, key: LOGSTASH_PORT }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            timeoutSeconds: 5
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            timeoutSeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8081
      targetPort: 8081

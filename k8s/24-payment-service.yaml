apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka-0.kafka.ticketing.svc.cluster.local 9092; do echo waiting for kafka; sleep 3; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 3; done"]
        - name: wait-for-inventory-service
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://inventory-service:8082/actuator/health | grep -q '\"status\":\"UP\"'; do echo waiting for inventory-service; sleep 5; done"]
      containers:
        - name: payment-service
          image: ticketing/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: KAFKA_BOOTSTRAP_SERVERS }
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: REDIS_HOST }
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: REDIS_PORT }
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: RAZORPAY_KEY_ID }
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: RAZORPAY_KEY_SECRET }
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: RAZORPAY_WEBHOOK_SECRET }
            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: INVENTORY_SERVICE_URL }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            timeoutSeconds: 5
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            timeoutSeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 600m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 8086
      targetPort: 8086

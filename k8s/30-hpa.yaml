apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # Spring Boot + Hibernate + Flyway startup briefly looks like a sustained CPU
      # spike to metrics-server; without this, HPA scales up on every fresh pod start,
      # and the extra replicas fight the still-starting one for CPU on this small node.
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
